<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BioTracker UI Harness</title>
<link rel="stylesheet" href="/style.css">
<style>
  body { margin: 0; min-height: 100vh; background: #13151b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #e2e8f0; overflow-x: hidden; }
  #st-mock-topbar { height: 42px; background: #1a1d26; border-bottom: 1px solid #2d3242; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-size: 13px; color: #94a3b8; }
  #st-mock-topbar b { color: #f1f5f9; }
  #st-mock-chat { max-width: 800px; margin: 30px auto; padding: 0 20px; display: flex; flex-direction: column; gap: 16px; opacity: 0.65; }
  .st-mock-msg { display: flex; flex-direction: column; gap: 4px; max-width: 85%; }
  .st-mock-msg--user { align-self: flex-end; align-items: flex-end; }
  .st-mock-msg--ai { align-self: flex-start; align-items: flex-start; }
  .st-mock-bubble { padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.6; }
  .st-mock-msg--user .st-mock-bubble { background: #3b82f6; color: #fff; }
  .st-mock-msg--ai .st-mock-bubble { background: #262a36; border: 1px solid #33394a; color: #cbd5e1; }
  .st-mock-name { font-size: 12px; color: #64748b; margin-bottom: 2px; }
  #harness-quick-bar { position: fixed; top: 50px; left: 20px; z-index: 99999; background: rgba(26, 29, 38, 0.95); border: 1px solid #475569; border-radius: 8px; padding: 8px 12px; display: flex; gap: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); backdrop-filter: blur(8px); }
  #harness-quick-bar button { background: #334155; color: #f8fafc; border: 1px solid #475569; border-radius: 6px; padding: 6px 12px; font-size: 12px; cursor: pointer; transition: all 0.2s; }
  #harness-quick-bar button:hover { background: #475569; border-color: #94a3b8; }
  #harness-quick-bar button.is-active { background: #ec4899; border-color: #f472b6; font-weight: bold; }
</style>
</head>
<body>
<div id="st-mock-topbar">
  <div><b>SillyTavern</b> <span style="opacity:0.6;margin-left:8px;">扩展：BS BioTracker 生理追踪器已加载</span></div>
  <div style="font-size:12px;color:#94a3b8;">当前角色：<span id="st-current-char" style="color:#f472b6;font-weight:bold;">艾拉</span> · 纯正酒馆宿主环境模拟</div>
</div>

<div id="harness-quick-bar">
  <button type="button" id="btn-show-aila" class="is-active">艾拉 (常态/平静态)</button>
  <button type="button" id="btn-show-qila">琪拉 (孕晚期/溢出憋耐态)</button>
  <button type="button" id="btn-show-beila">贝拉 (产后/极限心跳♥)</button>
  <span style="border-right:1px solid #475569;margin:0 4px;"></span>
  <button type="button" id="btn-tab-overview">切到【概览】</button>
  <button type="button" id="btn-tab-description">切到【描述】(看胸腹私处)</button>
</div>

<div id="st-mock-chat">
  <div class="st-mock-msg st-mock-msg--user">
    <div class="st-mock-name">用户</div>
    <div class="st-mock-bubble">艾拉，最近身体感觉怎么样？身体有没有哪里不舒服？</div>
  </div>
  <div class="st-mock-msg st-mock-msg--ai">
    <div class="st-mock-name">艾拉</div>
    <div class="st-mock-bubble"><i>*艾拉微微垂眸，双手自然交叠在柔软平坦的腹前，脸上泛起浅浅的笑意，从容中带着一丝微不可察的娇羞。*</i><br><br>“承蒙挂念，我的身体一切都好呢……稍微坐久了有一点点想去洗手间，不过完全不影响，你不用担心我。”</div>
  </div>
</div>
<script type="module">
  const CHAT_KEY = 'ui-harness-chat';

  const makeCharacter = (name, overrides = {}) => ({
    name,
    initialized: true,
    updatedAt: Date.now(),
    profile: {
      base: {
        stage: '卵泡期', days: 3, isHere: true, age: 24, race: '人类', derivedType: null,
        vitality: 80, libido: 20, uterinePressure: 10, psyStress: 30,
        vitalityLevel: 4, psyStressLevel: 4, eggs: 1, sperms: [],
        fertilizationDays: 0, latestSexDays: 99,
        ...overrides.base,
      },
      bio: {},
      metabolism: { urine: 25, stool: 8, excretion: 20, hunger: 30, sleep: 10, milk: 5, odor: 10, companionship: 15, ...overrides.metabolism },
      descriptions: {
        normalDescription: '外貌|黑发碧眼，身形修长柔软;;神态|从容微笑，眼神温润;;胸部|C罩杯饱满挺拔，乳晕淡粉，行动时有轻柔微颤;;腹部|平坦温软，小腹平滑无赘肉;;私处|紧致微润，色泽粉嫩;;后庭|紧闭安宁;;',
        pregnantDescription: '',
        ...overrides.descriptions,
      },
      experience: { sexCount: 0, birthCount: 0, records: [] },
      skills: [],
      talents: [],
      skillHistory: [],
      children: [],
      diary: [],
      notify: {},
      ...overrides.profile,
    },
  });

  const chatState = {
    skillCatalog: [
      { id: 1, name: '剑术', description: '使用长剑进行攻防的实战技巧。' },
      { id: 2, name: '魔力感知', description: '辨识周遭魔力流动的能力。' },
      { id: 3, name: '察言观色', description: '从神情与语气读出对方真意。' },
      { id: 4, name: '隐忍含蓄', description: '压下情绪不形于色。' },
      { id: 5, name: '才情雅艺', description: '诗书琴画一类的雅致修养。' },
    ],
    nextSkillId: 6,
    characters: {
      艾拉: makeCharacter('艾拉', {
        profile: {
          // 多项技能：验证「一次列出全部」的排版，其中 skillId 5 已满级走 MAX 分支
          skills: [
            { skillId: 1, level: 3, exp: 120 },
            { skillId: 3, level: 3, exp: 0 },
            { skillId: 4, level: 5, exp: 1200 },
            { skillId: 5, level: 10, exp: 0 },
          ],
          // 有技能有天赋 → 格子右上角楔形角标；skillId 2 有天赋无技能 → 不显示。
          // 覆盖苦手 Lv2 / 擅长 Lv3 / 擅长 Lv5（满）/ 苦手 Lv1 四种楔形数量与朝向。
          talents: [
            { skillId: 1, level: -2, exp: -40 },
            { skillId: 2, level: 1, exp: 30 },
            { skillId: 3, level: 3, exp: 0 },
            { skillId: 4, level: 5, exp: 0 },
            { skillId: 5, level: -1, exp: 0 },
          ],
          skillHistory: [{
            skillId: 1, fromLevel: 1, toLevel: 3, reason: '在连续实战中掌握了新的剑术节奏。', source: 'story', timestamp: Date.now() - 3600000,
          }],
          wardrobe: {
            enabled: true,
            items: [
              { id: 1, name: '白色连身裙', note: '及膝雪纺，方领。', slot: 'main', parts: ['连身裙'], masking: 6, support: 4, capacity: 3, convenience: 5 },
              { id: 2, name: '衬衫牛仔裤', note: '白衬衫配直筒牛仔裤。', slot: 'main', parts: ['白衬衫', '牛仔裤'], masking: 7, support: 5, capacity: 4, convenience: 7 },
              { id: 3, name: '蕾丝内衣', note: '浅色蕾丝，贴身。', slot: 'accessory', layer: 'inner', masking: 0, support: 2, capacity: 0, convenience: 0 },
              { id: 4, name: '针织外套', note: '米色开衫。', slot: 'accessory', masking: 2, support: 0, capacity: 0, convenience: 0 },
            ],
          },
          outfit: { mainItemId: 1, accessoryItemIds: [3, 4], temporaryItems: [], wearState: '敞开', pregFit: null },
        },
      }),
      琪拉: makeCharacter('琪拉', {
        base: { stage: '孕晚期', days: 152, age: 26, eggs: 0 },
        descriptions: {
          normalDescription: '外貌|金发碧眼，身段丰腴;;胸部|D罩杯沉重涨大，乳头敏感微硬;;腹部|高耸隆起，沉重下垂;;',
          pregnantDescription: '供养|胎盘附着于后壁，血运充盈良好;;羊水|清亮充盈，量适中;;胸部|双乳充血肿胀沉重，触碰微疼，偶有初乳渗漏;;腹部|腹壁明显紧绷发亮，子宫高居上腹，胎动频繁有力;;胎况|双胎头位，已接近入盆;;',
        },
        profile: {
          metabolism: { urine: 65, stool: 32, hunger: 75, sleep: 80, milk: 40 },
          pregnant: {
            pregnantDays: 152,
            effectivePregnantDays: 152,
            amnionDurability: 82,
            // 双胎：一胎正亲和（擅长方向）、一胎负亲和（苦手方向），验证胎儿天赋显示
            fetuses: [
              { fathers: '莱昂', fatherRace: '人类', embryoType: '胎生', gender: '女', weight: 1.05, tendencyAngle: 30, affinity: 60, talents: [{ skillId: 1, level: 2, exp: 40 }] },
              { fathers: '莱昂', fatherRace: '人类', embryoType: '胎生', gender: '男', weight: 0.98, tendencyAngle: -20, affinity: -35, talents: [{ skillId: 2, level: -1, exp: -30 }] },
            ],
          },
        },
      }),
      贝拉: makeCharacter('贝拉', {
        base: { stage: '产后恢复', days: 10, age: 27 },
        profile: {
          metabolism: { urine: 95, stool: 55, hunger: 130, sleep: 125, milk: 125 },
          wardrobe: {
            enabled: true,
            items: [
              { id: 1, name: '孕妇裙', note: '高腰伞形，弹性面料。', slot: 'main', masking: 6, support: 5, capacity: 8, convenience: 6 },
              { id: 2, name: '哺乳内衣', note: '前开扣。', slot: 'accessory', layer: 'inner', masking: 0, support: 3, capacity: 0, convenience: 0 },
            ],
          },
          outfit: {
            mainItemId: 1, accessoryItemIds: [2], temporaryItems: [], wearState: '整齐',
            pregFit: { pregWearPressure: 3.3, gap: { masking: 2.7, support: 4.7, capacity: 4.7, convenience: 2.7 } },
          },
        },
      }),
    },
    snapshots: [],
    lastOperationLogs: [],
  };

  const ctx = {
    chatId: CHAT_KEY,
    characters: [{ name: '艾拉', avatar: 'aila.png', description: '测试角色卡。' }],
    characterId: 0,
    name1: '用户',
    name2: '艾拉',
    chat: [],
    extensionSettings: {
      bs_biotracker: {
        enabled: true,
        theme: 'peach',
        deviceSize: 'phone',
        fontSize: 'standard',
        triggerTiming: 'after_ai',
        targetNames: '',
        chatStates: { [CHAT_KEY]: chatState },
      },
    },
    saveSettingsDebounced() {},
    eventSource: { on() {}, off() {}, removeListener() {}, once() {} },
    event_types: {},
    async loadWorldInfo(name) {
      const books = {
        '全局设定书': { name: '全局设定书', entries: [{ uid: 1, comment: '世界观总纲', content: '大陆历八百年。', disable: false }] },
        '性格适配衣橱': { name: '性格适配衣橱', entries: [
          { uid: 1, comment: '衣橱-日常', content: '日常便服清单。', disable: false },
          { uid: 2, comment: '衣橱-礼服', content: '正式场合衣着。', disable: false },
          { uid: 3, comment: '衣橱-战斗\n\n<!-- ACU_SKILL_META_START\n{"version":1,"description":"战斗装"}\n-->', content: '战斗装配置。', disable: false },
        ] },
      };
      return books[name] || null;
    },
  };

  globalThis.SillyTavern = { getContext: () => ctx };
  globalThis.toastr = { success() {}, error() {}, info() {}, warning() {} };
  // mock world-info 模块：全局启用书 + 当前角色（aila.png）的附加知识书 charLore
  globalThis.__bsBtWorldInfoModuleOverride__ = {
    selected_world_info: ['全局设定书'],
    world_info: {
      globalSelect: ['全局设定书'],
      charLore: [{ name: 'aila', extraBooks: ['性格适配衣橱'] }],
    },
  };

  await import('/index.js');

  // 启动后自动打开手机面板：悬浮球初始隐藏且只认 pointer 事件，这里合成一次点击。
  const autoOpen = (retries = 40) => {
    const sphere = document.getElementById('bs-bt-floating-sphere');
    const modal = document.getElementById('bs-biotracker-modal');
    if (modal && getComputedStyle(modal).display !== 'none') return;
    if (!sphere) {
      if (retries > 0) setTimeout(() => autoOpen(retries - 1), 250);
      return;
    }
    sphere.style.display = 'flex';
    const rect = sphere.getBoundingClientRect();
    const cx = rect.x + rect.width / 2;
    const cy = rect.y + rect.height / 2;
    sphere.dispatchEvent(new PointerEvent('pointerdown', { clientX: cx, clientY: cy, bubbles: true, pointerId: 1 }));
    window.dispatchEvent(new PointerEvent('pointerup', { clientX: cx, clientY: cy, bubbles: true, pointerId: 1 }));
    setTimeout(() => {
      const opened = document.getElementById('bs-biotracker-modal');
      if ((!opened || getComputedStyle(opened).display === 'none') && retries > 0) {
        autoOpen(retries - 1);
      } else {
        // 自动导航进入“追踪”->点击“艾拉”，展示真实酒馆中打开角色仪表盘的样子
        const trackTile = document.querySelector('.bs-bt-home-tile[data-nav-view="track-list"]');
        if (trackTile) trackTile.click();
        setTimeout(() => {
          const charButtons = document.querySelectorAll('.bs-bt-track-character-button');
          if (charButtons.length > 0) charButtons[0].click();
        }, 150);
      }
    }, 500);
  };
  setTimeout(() => autoOpen(), 600);

  // 顶部快捷栏切角与切标签逻辑
  function selectCharacterByName(targetName) {
    document.getElementById('st-current-char').textContent = targetName;
    const backBtn = document.getElementById('bs-bt-track-back');
    if (backBtn && document.querySelector('#bs-bt-view-track-char.is-active')) {
      backBtn.click();
    }
    setTimeout(() => {
      const buttons = document.querySelectorAll('.bs-bt-track-character-button');
      for (const btn of buttons) {
        if (btn.textContent.includes(targetName)) {
          btn.click();
          break;
        }
      }
    }, 120);
  }

  document.getElementById('btn-show-aila')?.addEventListener('click', (e) => {
    document.querySelectorAll('#harness-quick-bar button').forEach(b => b.classList.remove('is-active'));
    e.target.classList.add('is-active');
    selectCharacterByName('艾拉');
  });
  document.getElementById('btn-show-qila')?.addEventListener('click', (e) => {
    document.querySelectorAll('#harness-quick-bar button').forEach(b => b.classList.remove('is-active'));
    e.target.classList.add('is-active');
    selectCharacterByName('琪拉');
  });
  document.getElementById('btn-show-beila')?.addEventListener('click', (e) => {
    document.querySelectorAll('#harness-quick-bar button').forEach(b => b.classList.remove('is-active'));
    e.target.classList.add('is-active');
    selectCharacterByName('贝拉');
  });
  document.getElementById('btn-tab-overview')?.addEventListener('click', () => {
    const tab = document.querySelector('#bs-bt-track-tabs .bs-bt-track-tab[data-track-tab="overview"]');
    if (tab) tab.click();
  });
  document.getElementById('btn-tab-description')?.addEventListener('click', () => {
    const tab = document.querySelector('#bs-bt-track-tabs .bs-bt-track-tab[data-track-tab="description"]');
    if (tab) tab.click();
  });
</script>
</body>
</html>
